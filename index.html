<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryFlow Studio</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>StoryFlow Studio</h1>
      <p>Create polished videos from your images in minutes.</p>
    </header>
    <main class="app-layout">
      <section class="controls">
        <div class="control-card">
          <h2>1. Upload Media</h2>
          <label class="file-label">
            <span>Select images</span>
            <input type="file" id="imageInput" accept="image/*" multiple />
          </label>
          <div class="subtitle-editor" id="subtitleEditor"></div>
          <label class="file-label">
            <span>Background audio (optional)</span>
            <input type="file" id="audioInput" accept="audio/*" />
          </label>
        </div>
        <div class="control-card">
          <h2>2. Stylize</h2>
          <label class="field">
            <span>Filter</span>
            <select id="filterSelect">
              <option value="none">None</option>
              <option value="grayscale(100%)">Grayscale</option>
              <option value="sepia(80%)">Warm Sepia</option>
              <option value="contrast(120%) saturate(120%)">Vivid Contrast</option>
              <option value="saturate(160%)">Punchy Color</option>
              <option value="hue-rotate(320deg) saturate(130%)">Sunset Glow</option>
            </select>
          </label>
          <label class="field">
            <span>Slide duration (seconds)</span>
            <input type="number" id="durationInput" min="2" value="4" />
          </label>
        </div>
        <div class="control-card actions">
          <button id="previewBtn" class="primary">Preview story</button>
          <button id="stopBtn" class="ghost" disabled>Stop preview</button>
        </div>
      </section>
      <section class="preview">
        <div class="stage">
          <img id="previewImage" alt="Preview" />
          <div id="subtitleDisplay" class="subtitle-display"></div>
        </div>
        <div class="transition-readout">
          Transition: <span id="transitionName">—</span>
        </div>
        <audio id="audioPlayer" controls></audio>
      </section>
    </main>
    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
